name: Profit-first previous-week exact replay

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-24.04
    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Replay unchanged +943 strategy on Aug 24-28
        run: python scripts/research_profit_first_aug24_28_upstox.py
      - uses: actions/upload-artifact@v4
        with:
          name: profit-first-aug24-28-exact-replay
          path: |
            profit_first_aug24_28_2026.json
            profit_first_aug24_28_2026_trades.csv
