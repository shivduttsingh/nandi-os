name: Profit-first midday reversal proof

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Replay profit-first setup
        run: python scripts/research_profit_first_midday_reversal.py
      - uses: actions/upload-artifact@v4
        with:
          name: profit-first-midday-reversal
          path: |
            profit_first_midday_reversal.json
            profit_first_midday_reversal_trades.csv
