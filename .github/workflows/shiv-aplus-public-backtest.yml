name: SHIV and A++++ public backtest

on:
  pull_request:
    branches: [shiv]
    paths:
      - 'scripts/run_shiv_aplus_public_backtest.py'
      - '.github/workflows/shiv-aplus-public-backtest.yml'
      - 'shiv_v1/**'
      - 'shiv_v2/**'
      - 'nandi_v2/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install 'openpyxl>=3.1'
      - name: Run June 2026 SHIV and A++++ replay
        env:
          PYTHONPATH: .
        run: python scripts/run_shiv_aplus_public_backtest.py --start 2026-06-01 --end 2026-06-30 --output shiv_aplus_public_backtest_results.json
      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiv-aplus-public-backtest-results
          path: shiv_aplus_public_backtest_results.json
          if-no-files-found: error
