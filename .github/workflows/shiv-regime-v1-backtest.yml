name: SHIV regime V1 backtest

on:
  pull_request:
    branches: [shiv]
    paths:
      - 'scripts/backtest_shiv_regime_v1.py'
      - '.github/workflows/shiv-regime-v1-backtest.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyarrow numpy
      - name: Run May-June regime backtest
        run: |
          python scripts/backtest_shiv_regime_v1.py \
            --start 2026-05-01 \
            --end 2026-06-30 \
            --output shiv_regime_v1_results.json
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: shiv-regime-v1-results
          path: shiv_regime_v1_results.json
