name: Strategy 70 daily density proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/search_strategy_70_option_impulse.py'
      - 'scripts/search_strategy_70_daily_density.py'
      - '.github/workflows/strategy-70-daily-density.yml'

permissions:
  contents: read

jobs:
  daily-density-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run daily-density monthly walk-forward proof
        run: python scripts/search_strategy_70_daily_density.py
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-70-daily-density
          path: strategy_70_daily_density.json
          if-no-files-found: error
