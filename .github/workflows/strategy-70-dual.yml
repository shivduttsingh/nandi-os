name: Strategy 70 dual proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/search_strategy_70_dual.py'
      - '.github/workflows/strategy-70-dual.yml'

permissions:
  contents: read

jobs:
  dual-70-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run dual monthly walk-forward proof
        run: python scripts/search_strategy_70_dual.py
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-70-dual
          path: strategy_70_dual.json
          if-no-files-found: error
