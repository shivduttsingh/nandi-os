name: Strategy 70 invalidation reversal proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/search_strategy_70_invalidation_reversal.py'
      - '.github/workflows/strategy-70-invalidation-reversal.yml'
permissions:
  contents: read
jobs:
  invalidation-reversal-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run invalidated momentum reversal proof
        run: python scripts/search_strategy_70_invalidation_reversal.py
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-70-invalidation-reversal
          path: strategy_70_invalidation_reversal.json
          if-no-files-found: error
