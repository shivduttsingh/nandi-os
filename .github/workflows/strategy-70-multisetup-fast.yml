name: Strategy 70 multi-setup fast proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/search_strategy_70_multisetup.py'
      - 'scripts/search_strategy_70_multisetup_fast.py'
      - 'scripts/search_strategy_70_option_impulse.py'
      - 'scripts/search_strategy_70_trend.py'
      - 'scripts/search_strategy_70_exhaustion_reversal.py'
      - '.github/workflows/strategy-70-multisetup-fast.yml'
permissions:
  contents: read
jobs:
  multisetup-fast-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run fast frozen multi-setup proof
        run: python scripts/search_strategy_70_multisetup_fast.py
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-70-multisetup-fast
          path: strategy_70_multisetup.json
          if-no-files-found: error
