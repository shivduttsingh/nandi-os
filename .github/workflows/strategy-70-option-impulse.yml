name: Strategy 70 option impulse search

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/search_strategy_70_option_impulse.py'
      - '.github/workflows/strategy-70-option-impulse.yml'

permissions:
  contents: read

jobs:
  option-impulse-search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run option impulse monthly walk-forward
        run: python scripts/search_strategy_70_option_impulse.py
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-70-option-impulse
          path: strategy_70_option_impulse.json
          if-no-files-found: error
