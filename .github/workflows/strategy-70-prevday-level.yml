name: Strategy 70 previous-day level search

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/search_strategy_70_prevday_level.py'
      - '.github/workflows/strategy-70-prevday-level.yml'

permissions:
  contents: read

jobs:
  prevday-level-search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run previous-day level monthly walk-forward
        run: python scripts/search_strategy_70_prevday_level.py
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-70-prevday-level
          path: strategy_70_prevday_level.json
          if-no-files-found: error
