name: Strategy 70 profit lock runner proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/search_strategy_70_profit_lock.py'
      - '.github/workflows/strategy-70-profit-lock.yml'
permissions:
  contents: read
jobs:
  profit-lock-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run profit-lock runner proof
        run: python scripts/search_strategy_70_profit_lock.py
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-70-profit-lock
          path: strategy_70_profit_lock.json
          if-no-files-found: error
