name: Strategy 70 opening regime selector
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/search_strategy_70_regime_selector.py'
      - '.github/workflows/strategy-70-regime-selector.yml'
permissions:
  contents: read
jobs:
  regime-selector-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run opening-regime selector proof
        run: python scripts/search_strategy_70_regime_selector.py
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-70-regime-selector
          path: strategy_70_regime_selector.json
          if-no-files-found: error
