name: Strategy 70 reliability proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/search_strategy_70_reliability.py'
      - 'scripts/search_strategy_70_multisetup.py'
      - 'scripts/search_strategy_70_option_impulse.py'
      - 'scripts/search_strategy_70_trend.py'
      - 'scripts/search_strategy_70_exhaustion_reversal.py'
      - '.github/workflows/strategy-70-reliability.yml'
permissions:
  contents: read
jobs:
  reliability-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run frozen reliability selector proof
        run: python scripts/search_strategy_70_reliability.py
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-70-reliability
          path: strategy_70_reliability.json
          if-no-files-found: error
