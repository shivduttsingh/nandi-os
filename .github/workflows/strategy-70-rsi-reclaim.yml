name: Strategy 70 RSI option reclaim proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/search_strategy_70_rsi_reclaim.py'
      - '.github/workflows/strategy-70-rsi-reclaim.yml'
permissions:
  contents: read
jobs:
  rsi-reclaim-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run RSI extreme reclaim proof
        run: python scripts/search_strategy_70_rsi_reclaim.py
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-70-rsi-reclaim
          path: strategy_70_rsi_reclaim.json
          if-no-files-found: error
