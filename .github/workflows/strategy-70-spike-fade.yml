name: Strategy 70 spike fade proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/search_strategy_70_spike_fade.py'
      - '.github/workflows/strategy-70-spike-fade.yml'

permissions:
  contents: read

jobs:
  spike-fade-70-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run spike-fade monthly walk-forward
        run: python scripts/search_strategy_70_spike_fade.py
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-70-spike-fade
          path: strategy_70_spike_fade.json
          if-no-files-found: error
