name: Strategy 70 ATM straddle scalp proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/search_strategy_70_straddle_scalp.py'
      - '.github/workflows/strategy-70-straddle-scalp.yml'
permissions:
  contents: read
jobs:
  straddle-scalp-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run ATM long-straddle scalp proof
        run: python scripts/search_strategy_70_straddle_scalp.py
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-70-straddle-scalp
          path: strategy_70_straddle_scalp.json
          if-no-files-found: error
