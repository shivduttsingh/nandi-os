name: Strategy 70 fast trend search

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/search_strategy_70_trend_fast.py'
      - '.github/workflows/strategy-70-trend-fast.yml'
      - 'scripts/search_strategy_70_trend.py'

permissions:
  contents: read

jobs:
  fast-trend-search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run bounded trend walk-forward search
        run: python scripts/search_strategy_70_trend_fast.py
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-70-trend-fast
          path: strategy_70_trend_fast.json
          if-no-files-found: error
