name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - agent/nandi-v2-unified-decision-engine

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m py_compile app.py cloud_service.py nandi_v2/*.py pages/*.py
