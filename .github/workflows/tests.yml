name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - agent/nandi-v2-unified-decision-engine

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m py_compile app.py nandi_v2/*.py pages/*.py

  shiv-regime-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backtest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyarrow numpy
      - name: Run fixed SHIV three-state backtest
        run: |
          python scripts/backtest_shiv_regime_v1.py \
            --start 2026-05-01 \
            --end 2026-06-30 \
            --output shiv_regime_v1_results.json
      - name: Upload regime evidence
        uses: actions/upload-artifact@v4
        with:
          name: shiv-regime-v1-results
          path: shiv_regime_v1_results.json
